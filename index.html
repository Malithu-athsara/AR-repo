<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Car Showroom</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        #status{
            position: fixed; top: 0; left: 0; right: 0; z-index: 999;
            padding: 12px;
            text-align: center;
            font: bold 18px sans-serif; color: #fff; background: #c62828;
        }
        #status.found {background: #2e7d32;}
    </style>

    
</head>
<body style="margin: 0; overflow: hidden;">
    <div id="status">Marker lost: point at the Hiro marker</div>

    <a-scene embedded vr-mode-ui="enabled: false"
             arjs="sourceType: webcam; debugUIEnabled: false;">
            <a-assets>
                <a-asset-item id="car" src="car1.glb"></a-asset-item>
            </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

        <a-marker preset="hiro" marker-status>
            <a-entity id="turntable" position="0 0 0">
                <a-cylinder position="0 0.025 0" radius="0.5" height="0.05" material="color: #263238; metalness: 0.5"></a-cylinder>
                <a-entity position="0 0.05 0">
                    <a-gltf-model src="#car" auto-fit="size: 0.7"></a-gltf-model>
                </a-entity>
            </a-entity>
            <a-sphere id="ball" class="clickable" position="-0.75 0.2 0" radius="0.13" material="color: #e53935; metalness: 0.3" color-change>
            </a-sphere>
            <a-box id="box" class="clickable" position="0.75 0.15 0" width="0.25" height="0.25" depth="0.25" material="color: #00bcd4; metalness: 0.4" grow-toggle>
    
            </a-box>
            <a-text value="Mini Car Showroom" position="0 0.01 0.8" rotation="-90 0 0"
            align="center" width="2.2" color="#ffffff" side="double"></a-text>


        </a-marker>

        <a-entity camera cursor="rayOrigin: mouse; fuse: false"
                  raycaster="objects: .clickable"></a-entity>
    </a-scene>

    <script src="animations.js"></script>    <!-- animations (fernando) -->
</body>>
</html>
